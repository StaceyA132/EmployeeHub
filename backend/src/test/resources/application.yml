# Test config: in-memory H2 database so tests run without Postgres or Docker
spring:
  datasource:
    url: jdbc:h2:mem:employeehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

employeehub:
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-bytes-long
    expiration-ms: 3600000
