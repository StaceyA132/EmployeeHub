server:
  port: 8080

spring:
  datasource:
    # Secrets come from environment variables (see .env.example); there are no defaults on purpose
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employeehub}
    username: ${DB_USERNAME:employeehub}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

employeehub:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  ai:
    # Leave ANTHROPIC_API_KEY unset to run without the Ask feature
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    effort: ${AI_EFFORT:low}
    timeout: ${AI_TIMEOUT:20s}
    max-retries: ${AI_MAX_RETRIES:2}
