server:
  port: 8080

spring:
  datasource:
    # Secrets come from environment variables (see .env.example); there are no defaults on purpose
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employeehub}
    username: ${DB_USERNAME:employeehub}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

employeehub:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
